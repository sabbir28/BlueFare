name: BlueFare CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: Build & Test Linux Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopus-dev libasound2-dev libpipewire-0.3-dev pkg-config

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ../server

      - name: Build Executables
        run: |
          cd build
          make -j$(nproc)

      - name: Run CTest Suite
        run: |
          cd build
          ctest --output-on-failure

  build-android:
    name: Build Android Client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew || true

      - name: Build Android Debug APK
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueFare-MultiMic-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
